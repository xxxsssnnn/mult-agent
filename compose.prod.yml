# 生产环境编排（加固版）。
# 与 docker-compose.yml（开发环境：含源码挂载 / --reload / 数据库端口公网暴露）严格分离。
#
# 使用：
#   1) cp .env.prod.example .env.prod 并填入强口令与随机 SECRET_KEY
#   2) docker compose -f compose.prod.yml --env-file .env.prod up -d --build
#
# 加固要点：
#   - 数据库/Redis/ChromaDB 不映射公网端口，仅存在于 internal 网络
#   - 后端不挂载源码、不使用 --reload
#   - 全部服务非 root 运行 + no-new-privileges
#   - 显式 CPU/内存/并发限制
#   - ChromaDB 固定版本（与后端 chromadb==1.5.9 对齐）
#   - 监控组件（Prometheus / Alertmanager）仅经 edge_net 抓取与转发，
#     管理 UI 只绑定回环地址，不暴露公网
name: multi-agent-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multi_agent}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须通过 .env.prod 设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data_net]
    # 不发布端口：仅容器网络内可达
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-multi_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?必须通过 .env.prod 设置 REDIS_PASSWORD}
    # 启用密码保护；不发布端口
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [data_net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    security_opt:
      - no-new-privileges:true

  chromadb:
    # 固定版本：需与 backend 的 chromadb==1.5.9 保持一致
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma_data:/data
    networks: [data_net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multi_agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    # 仅绑定本机回环，避免 API 直接暴露公网（外部经前端 nginx 反代 /api）
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 生产：不挂载源码、不 --reload
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --limit-concurrency
      - "200"
    # 就绪探针：关键依赖（数据库）不可用时容器被判 unhealthy，编排可据此摘流/重启
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    security_opt:
      - no-new-privileges:true
    networks: [data_net, edge_net]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multi_agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.core.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    security_opt:
      - no-new-privileges:true
    networks: [data_net]

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multi_agent}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.core.celery_app
      - beat
      - --loglevel=info
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    security_opt:
      - no-new-privileges:true
    networks: [data_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    security_opt:
      - no-new-privileges:true
    networks: [edge_net]

  # ---- 监控：指标采集与告警路由 ----
  # 镜像自带 non-root（nobody）用户；配置以只读方式挂载。
  # 不开启 --web.enable-lifecycle：避免出现未鉴权的配置热加载端点，
  # 改配置后请 `docker compose -f compose.prod.yml restart prometheus`。
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    # 仅绑定回环：管理 UI 不暴露公网，运维经跳板机/隧道访问
    ports:
      - "127.0.0.1:9090:9090"
    # 不依赖 alertmanager 才能启动：告警通道故障不应中断指标采集
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    security_opt:
      - no-new-privileges:true
    networks: [edge_net]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # 通知端点经文件注入（本目录已被 .gitignore 排除）；缺失会导致启动失败
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    security_opt:
      - no-new-privileges:true
    networks: [edge_net]

networks:
  # 对外/服务间交互网（前端 <-> 后端；监控组件在此抓取后端指标）
  edge_net:
    driver: bridge
  # 数据网：internal，禁止外部直接访问数据库/缓存/向量库
  data_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  prometheus_data:
  alertmanager_data:
