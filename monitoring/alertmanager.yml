# Alertmanager 配置：真实投递渠道 + 告警路由。
#
# 投递端点由文件注入，不写入仓库：
#   monitoring/secrets/webhook_url  ->  容器内 /etc/alertmanager/secrets/webhook_url
#   创建方式与可选端点见 monitoring/secrets/README.md
#
# 本文件改动后需重启才生效：
#   docker compose -f compose.prod.yml restart alertmanager

global:
  resolve_timeout: 5m

route:
  receiver: ops-webhook
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 严重告警提高重发频率，缩短发现到响应的时间
    - matchers:
        - 'severity="critical"'
      receiver: ops-webhook
      repeat_interval: 1h

receivers:
  - name: ops-webhook
    webhook_configs:
      # url 与 url_file 互斥；这里用 url_file 注入，避免投放端点进入仓库。
      # 文件缺失会导致 alertmanager 启动失败（刻意 fail-fast，见 secrets/README.md）。
      - url_file: /etc/alertmanager/secrets/webhook_url
        # 恢复也要通知，否则只能靠人盯看板确认已恢复
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  # 抓取目标整体不可达时，抑制由其派生的依赖/性能告警，避免告警风暴
  - source_matchers:
      - 'alertname="BackendTargetDown"'
    target_matchers:
      - 'alertname=~"BackendDatabaseUnavailable|BackendRedisUnavailable|BackendHighErrorRate|BackendHighLatencyP95"'
    equal: []
