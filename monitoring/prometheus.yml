# Prometheus 抓取配置（多智能体平台生产环境）。
#
# 由 compose.prod.yml 的 prometheus 服务以只读方式挂载到 /etc/prometheus/prometheus.yml。
# 抓取目标 backend:8000 走 edge_net（backend 同时接入 data_net 与 edge_net）。
# 告警规则见同目录 alerts.yml，告警路由见 alertmanager.yml。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: multi-agent-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
